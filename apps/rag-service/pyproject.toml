[project]
name = "rag-service"
version = "1.0.0"
description = "Data retrieval microservice for trivia question generation"
authors = [
    {name = "Quivio Team"}
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "llama-index-core==0.10.57",
    "llama-index-readers-wikipedia==0.1.4",
    "llama-index-readers-web==0.1.6",
    "openai==1.45.0",
    "supabase==2.3.4",
    "numpy==1.24.3",
    "pydantic==2.5.0",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
] 